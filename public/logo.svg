<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" fill="none">
  <!-- Outer Circular Badge -->
  <circle cx="500" cy="500" r="485" fill="#000000" stroke="#FFFFFF" stroke-width="26" />
  <circle cx="500" cy="500" r="448" fill="none" stroke="#FFFFFF" stroke-width="14" />

  <!-- 1. Left Network Connections (Graph Lines) -->
  <g stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <line x1="412" y1="280" x2="252" y2="350" />
    <line x1="252" y1="350" x2="180" y2="506" />
    <line x1="180" y1="506" x2="278" y2="660" />
    <line x1="278" y1="660" x2="468" y2="730" />

    <line x1="412" y1="280" x2="365" y2="475" />
    <line x1="252" y1="350" x2="365" y2="475" />
    <line x1="180" y1="506" x2="365" y2="475" />
    <line x1="278" y1="660" x2="365" y2="475" />
    <line x1="468" y1="730" x2="365" y2="475" />

    <line x1="412" y1="280" x2="180" y2="506" stroke-width="9" />
    <line x1="252" y1="350" x2="278" y2="660" stroke-width="9" />
    <line x1="252" y1="350" x2="468" y2="730" stroke-width="9" />
    <line x1="180" y1="506" x2="468" y2="730" stroke-width="9" />

    <line x1="412" y1="280" x2="520" y2="370" stroke-width="12" />
    <line x1="365" y1="475" x2="510" y2="490" stroke-width="12" />
    <line x1="365" y1="475" x2="470" y2="585" stroke-width="10" />
  </g>

  <!-- 2. Left Network Nodes (White Solid Dots) -->
  <g fill="#FFFFFF">
    <circle cx="412" cy="280" r="32" />
    <circle cx="252" cy="350" r="32" />
    <circle cx="180" cy="506" r="32" />
    <circle cx="278" cy="660" r="32" />
    <circle cx="468" cy="730" r="32" />
    <circle cx="365" cy="475" r="32" />
  </g>

  <!-- 3. Magnifying Glass (Search Loupe) -->
  <line
    x1="738"
    y1="575"
    x2="888"
    y2="725"
    stroke="#FFFFFF"
    stroke-width="56"
    stroke-linecap="round"
  />

  <circle
    cx="625"
    cy="455"
    r="195"
    fill="#000000"
    stroke="#FFFFFF"
    stroke-width="38"
  />

  <path
    d="M 650 322 A 148 148 0 0 1 772 442"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="20"
    stroke-linecap="round"
  />

  <!-- 4. Magnified Graph Inside Lens -->
  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <line x1="500" y1="428" x2="628" y2="385" />
    <line x1="628" y1="385" x2="725" y2="490" />
    <line x1="725" y1="490" x2="615" y2="550" />
    <line x1="615" y1="550" x2="520" y2="528" />
    <line x1="520" y1="528" x2="628" y2="385" />
    <line x1="628" y1="385" x2="615" y2="550" />
  </g>

  <g fill="#FFFFFF">
    <circle cx="628" cy="385" r="36" />
    <circle cx="725" cy="490" r="36" />
    <circle cx="615" cy="550" r="36" />
  </g>
